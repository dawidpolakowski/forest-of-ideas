<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Game Ideas – Forest of Ideas</title>

  <meta name="description"
    content="Game improvement ideas including MTG Arena and No Man's Sky concepts. Explore innovative gameplay features and improvements.">

  <meta name="author" content="Dawid Polakowski">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">

  <script>
    (function () {
      function apply(t) {
        document.documentElement.dataset.theme = t;
      }
      var t = new URLSearchParams(location.search).get('theme')
        || localStorage.getItem('theme')
        || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      apply(t);
      window.__toggleTheme = function () {
        t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
        localStorage.setItem('theme', t);
        apply(t);
      };
    })();
  </script>
</head>

<body>

  <header class="site-header">
    <div class="nav-inner">
      <a class="brand" href="index.html" aria-label="Forest of Ideas home">
        <span class="brand-text">
          <strong>Forest of Ideas</strong>
          <small>Game & app improvements</small>
        </span>
      </a>

      <nav class="nav-links" aria-label="Primary">
        <a href="index.html">← All Ideas</a>
        <button id="theme-toggle" class="theme-toggle" type="button" onclick="__toggleTheme()"
          aria-label="Toggle dark mode" title="Toggle theme">
          <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
          </svg>
          <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4.2" />
            <path d="M12 2v2.5M12 19.5V22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M2 12h2.5M19.5 12H22M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8" />
          </svg>
        </button>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <p class="eyebrow">Game Ideas</p>
      <h1>Game Improvements</h1>
      <p class="hero-subtitle">
        Innovative concepts and features designed to improve gameplay, UI/UX, and player experience across multiple game titles.
      </p>
    </section>

    <section class="toolbar" aria-label="Ideas filters">
      <label class="search-field">
        <span>Search ideas</span>
        <input id="search-input" type="search" placeholder="Search by title or game name" autocomplete="off">
      </label>
    </section>

    <section class="content-section">
      <div class="section-heading">
        <h2>Game Ideas</h2>
        <span id="result-count">Loading…</span>
      </div>

      <div id="ideas-container" class="ideas-grid" aria-live="polite"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <span>© 2026 Forest of Ideas</span>
      <div class="footer-links">
        <a href="https://github.com/dawidpolakowski/forest-of-ideas" target="_blank" rel="noreferrer">GitHub</a>
        <span>·</span>
        <a href="https://dawidpolakowski.github.io/daily-log/" target="_blank" rel="noreferrer">Daily Logs</a>
      </div>
    </div>
  </footer>

  <script src="data.js"></script>
  <script>
    class GameIdeasPage {
      constructor() {
        this.container = document.getElementById("ideas-container");
        this.searchInput = document.getElementById("search-input");
        this.resultCount = document.getElementById("result-count");

        this.init();
      }

      init() {
        this.renderIdeas();
        this.attachEventListeners();
      }

      attachEventListeners() {
        this.searchInput.addEventListener("input", () => this.renderIdeas());
      }

      renderIdeas() {
        const searchTerm = this.searchInput.value.toLowerCase();

        const filtered = ideas.filter(idea => {
          return idea.category === "Games" && (
            idea.title.toLowerCase().includes(searchTerm) ||
            idea.tags.join(" ").toLowerCase().includes(searchTerm)
          );
        });

        this.resultCount.textContent = `${filtered.length} ${filtered.length === 1 ? 'result' : 'results'}`;

        this.container.innerHTML = "";

        if (filtered.length === 0) {
          this.container.innerHTML = '<div class="no-results">No game ideas match your search</div>';
          return;
        }

        filtered.forEach(idea => {
          const card = document.createElement("a");
          card.href = idea.file;
          card.className = "idea-card";

          card.innerHTML = `
              <div class="idea-card-link">
                  <span class="card-category">${idea.category}</span>
                  <h3>${idea.title}</h3>
                  <p class="idea-card-description">${idea.description || ''}</p>
                  <div class="idea-card-footer">
                      <div class="tags">${idea.tags.map(tag => `<span class="tag">${tag}</span>`).join("")}</div>
                  </div>
              </div>
          `;

          this.container.appendChild(card);
        });
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      new GameIdeasPage();
    });
  </script>

</body>

</html>
